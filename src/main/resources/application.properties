spring.application.name=policy-management-platform

# --- H2 (file-based) ---
spring.datasource.url=jdbc:h2:file:./data/policydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console is for local development only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- JPA ---
# Flyway owns the schema; Hibernate only validates it against the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Logging (structured JSON; MDC requestId is included automatically) ---
logging.structured.format.console=ecs

# --- Policy settings ---
policy.summary.expiring-soon-days=30
